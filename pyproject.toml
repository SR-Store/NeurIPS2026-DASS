[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dass"
version = "0.1.0"
description = "Dynamic auxiliary search for symbolic regression with LLM-SR and PySR"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "sympy", "pandas", "pyarrow"]

[project.optional-dependencies]
pysr = ["pysr==2.0.0a2"]
test = ["pytest>=8"]

[project.scripts]
dass-run = "dass.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dass = ["basis/*.json", "_vendor/llmsr/PROVENANCE.md", "_vendor/llmsr/LICENSE*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires an installed solver runtime such as Julia/PySR"]
